[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bug-pattern-profiler"
version = "0.1.0"
description = "RAG-powered Bug Pattern Profiler"
requires-python = ">=3.11"

dependencies = [
  "pydantic>=2.7",
  "httpx>=0.27",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
  "pytest>=8.0"
]

[tool.setuptools.packages.find]
include = ["packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]