[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bug-pattern-profiler"
version = "0.1.0"
description = "RAG-powered Bug Pattern Profiler"
requires-python = ">=3.11"

dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
  "tenacity>=8.2",
  "python-dotenv>=1.0",
  "numpy",
  "rapidfuzz",
  "pytest>=8.0",
  "pinecone>=5.0",

  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "requests",

  "sentence-transformers>=3.0",
  "torch",
  "groq",
]


[tool.setuptools.packages.find]
include = ["packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]